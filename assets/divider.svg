<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="24" viewBox="0 0 1000 24" role="presentation" aria-hidden="true" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<defs>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
    <stop offset=".25" stop-color="#00f0ff" stop-opacity=".7"/>
    <stop offset=".5" stop-color="#9d4dff"/>
    <stop offset=".75" stop-color="#ff2a6d" stop-opacity=".7"/>
    <stop offset="1" stop-color="#ff2a6d" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
    <stop offset=".6" stop-color="#7fe9ff" stop-opacity=".9"/>
    <stop offset="1" stop-color="#ffffff"/>
  </linearGradient>
  <filter id="glow" x="-20%" y="-300%" width="140%" height="700%">
    <feGaussianBlur stdDeviation="2.5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>
<style>
  .p{animation:run 4s linear infinite}
  @keyframes run{from{transform:translateX(-120px)}to{transform:translateX(1040px)}}
  .d{animation:dd 2s steps(1) infinite}
  @keyframes dd{0%,55%{opacity:1}56%,70%{opacity:.2}71%,100%{opacity:1}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<line x1="20" y1="12" x2="980" y2="12" stroke="url(#line)" stroke-width="2"/>
<rect class="p" x="0" y="10" width="100" height="4" fill="url(#pulse)" filter="url(#glow)"/>
<g class="d" fill="#ffb000" filter="url(#glow)">
  <path d="M500 4L508 12L500 20L492 12Z"/>
</g>
<path d="M470 12H486M514 12H530" stroke="#ffb000" stroke-width="2"/>
</svg>
