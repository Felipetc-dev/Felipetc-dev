<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Processos ativos: em desenvolvimento</title>
<desc id="d">Quatro processos em execução: análise e visualização de dados com Power BI, bancos de dados com SQL, bootcamp DXC IA do Zero ao Primeiro Agente da DIO, e infraestrutura em nuvem na AWS.</desc>
<defs>
  <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#00f0ff"/>
    <stop offset=".5" stop-color="#9d4dff"/>
    <stop offset="1" stop-color="#ff2a6d"/>
  </linearGradient>
  <linearGradient id="seg" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00f0ff" stop-opacity=".1"/>
    <stop offset="1" stop-color="#7fe9ff"/>
  </linearGradient>
  <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="2" fill="#000" opacity=".2"/>
  </pattern>
</defs>
<style>
  .mono{font-family:'Courier New',Courier,monospace;font-weight:700}
  .seg{animation:mv 2.6s ease-in-out infinite alternate}
  @keyframes mv{from{transform:translateX(0)}to{transform:translateX(180px)}}
  .run{animation:rn 1.4s steps(1) infinite}
  @keyframes rn{0%,60%{opacity:1}61%,100%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<rect x="3" y="3" width="994" height="324" rx="14" fill="#070a14"/>
<rect x="3" y="3" width="994" height="324" rx="14" fill="url(#scan)"/>

<rect x="36" y="30" width="8" height="26" fill="#ffb000"/>
<text class="mono" x="56" y="52" font-size="22" fill="#ffb000" filter="url(#glow)" letter-spacing="2">PROCESSOS ATIVOS // EM DESENVOLVIMENTO</text>
<path d="M30 70H970" stroke="#2a3558" stroke-width="2" stroke-dasharray="2 6"/>

<!-- 1 -->
<rect x="36" y="86" width="928" height="52" rx="8" fill="#0a1020" stroke="#00f0ff" stroke-opacity=".35"/>
<text class="mono" x="52" y="108" font-size="11" fill="#7f8fb8">PID 0x01</text>
<text class="mono" x="52" y="128" font-size="16" fill="#fff4e0">Análise &amp; Visualização de Dados</text>
<text class="mono" x="330" y="128" font-size="12" fill="#00f0ff">Dashboards e análises práticas com Power BI</text>
<rect x="690" y="106" width="250" height="10" rx="5" fill="#05070f" stroke="#2a3558"/>
<rect class="seg" x="690" y="106" width="70" height="10" rx="5" fill="url(#seg)" filter="url(#glow)"/>
<text class="mono run" x="944" y="104" font-size="11" fill="#39ff14" text-anchor="end">RUNNING</text>

<!-- 2 -->
<rect x="36" y="148" width="928" height="52" rx="8" fill="#0a1020" stroke="#ff2a6d" stroke-opacity=".35"/>
<text class="mono" x="52" y="170" font-size="11" fill="#7f8fb8">PID 0x02</text>
<text class="mono" x="52" y="190" font-size="16" fill="#fff4e0">Bancos de Dados</text>
<text class="mono" x="330" y="190" font-size="12" fill="#ff2a6d">Modelagem relacional e consultas complexas em SQL</text>
<rect x="690" y="168" width="250" height="10" rx="5" fill="#05070f" stroke="#2a3558"/>
<rect class="seg" style="animation-delay:-.7s" x="690" y="168" width="70" height="10" rx="5" fill="#ff2a6d" opacity=".85" filter="url(#glow)"/>
<text class="mono run" style="animation-delay:-.3s" x="944" y="166" font-size="11" fill="#39ff14" text-anchor="end">RUNNING</text>

<!-- 3 -->
<rect x="36" y="210" width="928" height="52" rx="8" fill="#0a1020" stroke="#ffb000" stroke-opacity=".4"/>
<text class="mono" x="52" y="232" font-size="11" fill="#7f8fb8">PID 0x03</text>
<text class="mono" x="52" y="252" font-size="16" fill="#fff4e0">Bootcamp DXC · IA do Zero ao Primeiro Agente (DIO)</text>
<text class="mono" x="520" y="252" font-size="12" fill="#ffb000">Criando fluxos autônomos de IA</text>
<rect x="690" y="230" width="250" height="10" rx="5" fill="#05070f" stroke="#2a3558"/>
<rect class="seg" style="animation-delay:-1.4s" x="690" y="230" width="70" height="10" rx="5" fill="#ffb000" opacity=".9" filter="url(#glow)"/>
<text class="mono run" style="animation-delay:-.6s" x="944" y="228" font-size="11" fill="#39ff14" text-anchor="end">RUNNING</text>

<!-- 4 -->
<rect x="36" y="272" width="928" height="40" rx="8" fill="#0a1020" stroke="#9d4dff" stroke-opacity=".45"/>
<text class="mono" x="52" y="290" font-size="11" fill="#7f8fb8">PID 0x04</text>
<text class="mono" x="52" y="306" font-size="16" fill="#fff4e0">Infraestrutura em Nuvem</text>
<text class="mono" x="330" y="306" font-size="12" fill="#b985ff">AWS: EC2, CloudWatch e Auto Scaling</text>
<rect x="690" y="288" width="250" height="10" rx="5" fill="#05070f" stroke="#2a3558"/>
<rect class="seg" style="animation-delay:-2s" x="690" y="288" width="70" height="10" rx="5" fill="#9d4dff" filter="url(#glow)"/>
<text class="mono run" style="animation-delay:-.9s" x="944" y="286" font-size="11" fill="#39ff14" text-anchor="end">RUNNING</text>

<rect x="3" y="3" width="994" height="324" rx="14" fill="none" stroke="url(#border)" stroke-width="2"/>
</svg>
