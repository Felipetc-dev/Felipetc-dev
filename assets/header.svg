<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Felipe Tavares da Costa</title>
<desc id="d">Banner ciberpunk com skyline sob chuva de neon. Dados, Inteligência Artificial e Engenharia de Software.</desc>
<defs>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#05030d"/>
    <stop offset=".55" stop-color="#1b0b3a"/>
    <stop offset="1" stop-color="#ff2a6d" stop-opacity=".55"/>
  </linearGradient>
  <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#00f0ff"/>
    <stop offset=".5" stop-color="#9d4dff"/>
    <stop offset="1" stop-color="#ff2a6d"/>
  </linearGradient>
  <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ff2a6d" stop-opacity="0"/>
    <stop offset="1" stop-color="#ff2a6d" stop-opacity=".9"/>
  </linearGradient>
  <filter id="glow" x="-20%" y="-60%" width="140%" height="220%">
    <feGaussianBlur stdDeviation="4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="16"/></filter>
  <pattern id="rainA" width="50" height="80" patternUnits="userSpaceOnUse">
    <line x1="12" y1="4" x2="8" y2="28" stroke="#7fe9ff" stroke-width="1.2" stroke-opacity=".55"/>
    <line x1="38" y1="46" x2="34" y2="72" stroke="#7fe9ff" stroke-width="1.2" stroke-opacity=".45"/>
  </pattern>
  <pattern id="rainB" width="70" height="110" patternUnits="userSpaceOnUse">
    <line x1="20" y1="10" x2="17" y2="34" stroke="#ff7ab6" stroke-width="1" stroke-opacity=".35"/>
    <line x1="52" y1="62" x2="49" y2="90" stroke="#7fe9ff" stroke-width="1" stroke-opacity=".3"/>
  </pattern>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="2" fill="#000" opacity=".22"/>
  </pattern>
  <clipPath id="frame"><rect width="1000" height="340" rx="14"/></clipPath>
</defs>
<style>
  .mono{font-family:'Courier New',Courier,monospace;font-weight:700}
  .flick{animation:flick 6s infinite}
  @keyframes flick{0%,100%{opacity:1}3%{opacity:.35}4%{opacity:1}6%{opacity:.55}7%{opacity:1}52%{opacity:1}53%{opacity:.25}54%{opacity:1}}
  .rainA{animation:rainA .9s linear infinite}
  @keyframes rainA{to{transform:translateY(80px)}}
  .rainB{animation:rainB 1.5s linear infinite}
  @keyframes rainB{to{transform:translateY(110px)}}
  .gl1{animation:g1 5s steps(1) infinite}
  @keyframes g1{0%,92%,100%{transform:translate(0,0)}93%{transform:translate(-5px,1px)}95%{transform:translate(4px,-1px)}97%{transform:translate(-2px,0)}}
  .gl2{animation:g2 5s steps(1) infinite}
  @keyframes g2{0%,92%,100%{transform:translate(0,0)}94%{transform:translate(5px,-1px)}96%{transform:translate(-4px,1px)}}
  .blink{animation:bl 3s steps(1) infinite}
  @keyframes bl{0%,60%{opacity:1}61%,70%{opacity:.08}71%,100%{opacity:1}}
  .beacon{animation:bc 1.6s steps(1) infinite}
  @keyframes bc{0%,50%{opacity:1}51%,100%{opacity:.1}}
  .car{animation:car 14s linear infinite}
  @keyframes car{from{transform:translateX(-120px)}to{transform:translateX(1120px)}}
  .scanbar{animation:sb 5s linear infinite}
  @keyframes sb{from{transform:translateY(-20px)}to{transform:translateY(360px)}}
  .pulse{animation:pu 4s ease-in-out infinite}
  @keyframes pu{50%{opacity:.55}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<g clip-path="url(#frame)">
  <rect width="1000" height="340" fill="url(#sky)"/>
  <ellipse cx="500" cy="340" rx="560" ry="120" fill="#ff7a1a" opacity=".28" filter="url(#soft)" class="pulse"/>
  <circle cx="500" cy="175" r="118" fill="#ff2a6d" opacity=".10"/>
  <circle cx="500" cy="175" r="118" fill="none" stroke="#ff2a6d" stroke-opacity=".35" stroke-width="1.5" stroke-dasharray="3 7"/>

  <!-- skyline: camada de trás -->
  <g fill="#160b2e">
    <rect x="0" y="120" width="70" height="220"/>
    <rect x="70" y="80" width="60" height="260"/>
    <rect x="130" y="140" width="50" height="200"/>
    <rect x="180" y="170" width="60" height="170"/>
    <rect x="240" y="215" width="80" height="125"/>
    <rect x="320" y="235" width="120" height="105"/>
    <rect x="440" y="250" width="120" height="90"/>
    <rect x="560" y="235" width="110" height="105"/>
    <rect x="670" y="210" width="70" height="130"/>
    <rect x="740" y="165" width="60" height="175"/>
    <rect x="800" y="135" width="50" height="205"/>
    <rect x="850" y="75" width="70" height="265"/>
    <rect x="920" y="115" width="80" height="225"/>
  </g>
  <!-- antenas -->
  <g stroke="#2a1850" stroke-width="2">
    <line x1="100" y1="45" x2="100" y2="80"/>
    <line x1="885" y1="40" x2="885" y2="75"/>
  </g>
  <circle class="beacon" cx="100" cy="43" r="3.5" fill="#ff2a6d" filter="url(#glow)"/>
  <circle class="beacon" style="animation-delay:-.8s" cx="885" cy="38" r="3.5" fill="#ff2a6d" filter="url(#glow)"/>

  <!-- skyline: camada da frente -->
  <g fill="#07040f">
    <rect x="0" y="200" width="50" height="140"/>
    <rect x="50" y="160" width="45" height="180"/>
    <rect x="95" y="215" width="70" height="125"/>
    <rect x="165" y="245" width="60" height="95"/>
    <rect x="225" y="270" width="90" height="70"/>
    <rect x="315" y="285" width="130" height="55"/>
    <rect x="445" y="290" width="110" height="50"/>
    <rect x="555" y="280" width="120" height="60"/>
    <rect x="675" y="262" width="80" height="78"/>
    <rect x="755" y="225" width="55" height="115"/>
    <rect x="810" y="170" width="45" height="170"/>
    <rect x="855" y="205" width="70" height="135"/>
    <rect x="925" y="150" width="75" height="190"/>
  </g>

  <!-- letreiros neon -->
  <rect class="blink" x="58" y="175" width="8" height="42" fill="none" stroke="#ff2a6d" stroke-width="2" filter="url(#glow)"/>
  <rect class="blink" style="animation-delay:-1.4s" x="822" y="186" width="20" height="10" fill="none" stroke="#00f0ff" stroke-width="2" filter="url(#glow)"/>
  <rect class="blink" style="animation-delay:-2.2s" x="936" y="166" width="10" height="34" fill="none" stroke="#ffb000" stroke-width="2" filter="url(#glow)"/>

  <!-- janelas -->
  <g fill="#ffb000">
    <rect class="blink" x="12" y="214" width="5" height="4"/>
    <rect class="blink" style="animation-delay:-1s" x="28" y="230" width="5" height="4"/>
    <rect class="blink" style="animation-delay:-2s" x="70" y="232" width="5" height="4"/>
    <rect class="blink" style="animation-delay:-.5s" x="110" y="232" width="5" height="4"/>
    <rect class="blink" style="animation-delay:-1.7s" x="140" y="258" width="5" height="4"/>
    <rect class="blink" style="animation-delay:-2.6s" x="182" y="262" width="5" height="4"/>
    <rect class="blink" style="animation-delay:-.9s" x="776" y="245" width="5" height="4"/>
    <rect class="blink" style="animation-delay:-2.4s" x="870" y="224" width="5" height="4"/>
  </g>
  <g fill="#00f0ff">
    <rect class="blink" style="animation-delay:-.3s" x="36" y="250" width="5" height="4"/>
    <rect class="blink" style="animation-delay:-1.2s" x="78" y="196" width="5" height="4"/>
    <rect class="blink" style="animation-delay:-2.1s" x="124" y="250" width="5" height="4"/>
    <rect class="blink" style="animation-delay:-1.9s" x="764" y="256" width="5" height="4"/>
    <rect class="blink" style="animation-delay:-.6s" x="900" y="238" width="5" height="4"/>
    <rect class="blink" style="animation-delay:-2.8s" x="948" y="230" width="5" height="4"/>
  </g>

  <!-- spinner (carro voador) -->
  <g class="car">
    <g transform="translate(0,72)">
      <rect x="-26" y="7" width="26" height="2" fill="url(#trail)"/>
      <path d="M0 6 L20 0 L34 3 L42 8 L0 11Z" fill="#0a0616" stroke="#ffb000" stroke-width="1"/>
      <circle cx="3" cy="8.5" r="2.4" fill="#ff2a6d" filter="url(#glow)"/>
      <circle cx="40" cy="8" r="1.8" fill="#ffffff" filter="url(#glow)"/>
    </g>
  </g>

  <!-- chuva -->
  <rect class="rainA" x="0" y="-80" width="1000" height="500" fill="url(#rainA)"/>
  <rect class="rainB" x="0" y="-110" width="1000" height="560" fill="url(#rainB)"/>

  <!-- título -->
  <g class="mono" text-anchor="middle" letter-spacing="3">
    <text class="gl1" x="500" y="158" font-size="44" fill="#ff2a6d" opacity=".85">FELIPE TAVARES DA COSTA</text>
    <text class="gl2" x="500" y="158" font-size="44" fill="#00f0ff" opacity=".85">FELIPE TAVARES DA COSTA</text>
    <text class="flick" x="500" y="158" font-size="44" fill="#fff4e0" filter="url(#glow)">FELIPE TAVARES DA COSTA</text>
    <text x="500" y="196" font-size="15" fill="#00f0ff" filter="url(#glow)" letter-spacing="2">DADOS // INTELIGÊNCIA ARTIFICIAL // ENGENHARIA DE SOFTWARE</text>
  </g>

  <!-- HUD -->
  <g class="mono" font-size="12" fill="#ffb000">
    <text x="36" y="36">NEXUS//OS v2049.11</text>
    <text x="964" y="36" text-anchor="end">SYS.ONLINE</text>
    <text x="36" y="318" fill="#7fe9ff" opacity=".8">LAT -23.55 // LON -46.63</text>
    <text x="964" y="318" text-anchor="end" fill="#7fe9ff" opacity=".8">CHUVA ÁCIDA: 100%</text>
  </g>
  <circle class="beacon" cx="972" cy="32" r="3.5" fill="#39ff14" filter="url(#glow)"/>
  <g fill="none" stroke="#00f0ff" stroke-width="2" opacity=".8">
    <path d="M18 44V18H44"/><path d="M956 18H982V44"/><path d="M18 296V322H44"/><path d="M956 322H982V296"/>
  </g>

  <rect width="1000" height="340" fill="url(#scan)"/>
  <rect class="scanbar" x="0" y="0" width="1000" height="3" fill="#00f0ff" opacity=".28"/>
</g>
<rect x="2" y="2" width="996" height="336" rx="13" fill="none" stroke="url(#border)" stroke-width="2"/>
</svg>
