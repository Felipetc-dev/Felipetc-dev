<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="90" viewBox="0 0 1000 90" role="img" aria-labelledby="t" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Transmissão aberta: buscando estágio em Dados, IA e Desenvolvimento de Software</title>
<defs>
  <linearGradient id="border" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#00f0ff"/>
    <stop offset=".5" stop-color="#9d4dff"/>
    <stop offset="1" stop-color="#ff2a6d"/>
  </linearGradient>
  <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
    <feGaussianBlur stdDeviation="2.5" result="b"/>
