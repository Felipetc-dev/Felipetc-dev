<style>
  .mono{font-family:'Courier New',Courier,monospace;font-weight:700}
  .roll{animation:rl 20s linear infinite}
  @keyframes rl{from{transform:translateX(0)}to{transform:translateX(-920px)}}
  .led{animation:ld 1.6s steps(1) infinite}
  @keyframes ld{0%,55%{opacity:1}56%,100%{opacity:.15}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect x="3" y="3" width="994" height="84" rx="12" fill="#070a14"/>
<rect x="3" y="3" width="994" height="84" rx="12" fill="url(#scan)"/>
<rect x="3" y="3" width="994" height="84" rx="12" fill="none" stroke="url(#border)" stroke-width="2"/>
<circle class="led" cx="38" cy="45" r="5" fill="#39ff14" filter="url(#glow)"/>
<text class="mono" x="54" y="50" font-size="14" fill="#ffb000" filter="url(#glow)" letter-spacing="1">TRANSMISSÃO ABERTA</text>
<path d="M222 22V68" stroke="#2a3558" stroke-width="2"/>
<g clip-path="url(#tick)">
  <g class="roll mono" font-size="15" fill="#00f0ff">
