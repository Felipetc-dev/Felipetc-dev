<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="224" viewBox="0 0 1000 224" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="t">Idiomas</title>
<desc id="d">Português nativo, espanhol intermediário/avançado e francês básico, cada um com a bandeira do país.</desc>
<defs>
  <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#00f0ff"/>
    <stop offset=".5" stop-color="#9d4dff"/>
    <stop offset="1" stop-color="#ff2a6d"/>
  </linearGradient>
  <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/>
    <stop offset=".5" stop-color="#fff" stop-opacity=".45"/>
    <stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="2" fill="#000" opacity=".2"/>
  </pattern>
  <clipPath id="fc"><rect width="64" height="44" rx="5"/></clipPath>
</defs>
<style>
  .mono{font-family:'Courier New',Courier,monospace;font-weight:700}
  .sh{animation:sh 4.5s ease-in-out infinite}
  @keyframes sh{0%{transform:translateX(-80px)}60%,100%{transform:translateX(90px)}}
  .b{animation:bp 3s ease-in-out infinite}
  @keyframes bp{0%,100%{opacity:1}50%{opacity:.55}}
  @media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<rect x="3" y="3" width="994" height="218" rx="14" fill="#070a14"/>
<rect x="3" y="3" width="994" height="218" rx="14" fill="url(#scan)"/>
<rect x="36" y="30" width="8" height="26" fill="#ffb000"/>
<text class="mono" x="56" y="52" font-size="22" fill="#ffb000" filter="url(#glow)" letter-spacing="2">TRADUTORES UNIVERSAIS // IDIOMAS</text>
<path d="M30 70H970" stroke="#2a3558" stroke-width="2" stroke-dasharray="2 6"/>

<!-- Português -->
<rect x="40" y="88" width="290" height="112" rx="10" fill="#0a1020" stroke="#00f0ff" stroke-opacity=".5" stroke-width="1.5"/>
<g transform="translate(60 108)">
  <g clip-path="url(#fc)">
    <rect width="64" height="44" fill="#009C3B"/>
    <polygon points="32,4 60,22 32,40 4,22" fill="#FFDF00"/>
    <circle cx="32" cy="22" r="10" fill="#002776"/>
    <path d="M23 21 Q32 17 41 23" stroke="#fff" stroke-width="2" fill="none"/>
    <rect class="sh" x="0" y="0" width="30" height="44" fill="url(#shine)"/>
  </g>
  <rect width="64" height="44" rx="5" fill="none" stroke="#fff" stroke-opacity=".25"/>
</g>
<text class="mono" x="146" y="130" font-size="19" fill="#fff4e0">PORTUGUÊS</text>
<text class="mono" x="146" y="152" font-size="13" fill="#00f0ff">NATIVO</text>
<g fill="#00f0ff" filter="url(#glow)">
  <rect class="b" x="146" y="168" width="28" height="8" rx="2"/>
  <rect class="b" style="animation-delay:-.4s" x="180" y="168" width="28" height="8" rx="2"/>
  <rect class="b" style="animation-delay:-.8s" x="214" y="168" width="28" height="8" rx="2"/>
  <rect class="b" style="animation-delay:-1.2s" x="248" y="168" width="28" height="8" rx="2"/>
  <rect class="b" style="animation-delay:-1.6s" x="282" y="168" width="28" height="8" rx="2"/>
</g>

<!-- Espanhol -->
<rect x="355" y="88" width="290" height="112" rx="10" fill="#0a1020" stroke="#ffb000" stroke-opacity=".55" stroke-width="1.5"/>
<g transform="translate(375 108)">
  <g clip-path="url(#fc)">
    <rect width="64" height="44" fill="#AA151B"/>
    <rect y="11" width="64" height="22" fill="#F1BF00"/>
    <rect class="sh" style="animation-delay:-1.2s" x="0" y="0" width="30" height="44" fill="url(#shine)"/>
  </g>
  <rect width="64" height="44" rx="5" fill="none" stroke="#fff" stroke-opacity=".25"/>
</g>
<text class="mono" x="461" y="130" font-size="19" fill="#fff4e0">ESPANHOL</text>
<text class="mono" x="461" y="152" font-size="12" fill="#ffb000">INTERMEDIÁRIO / AVANÇADO</text>
<g fill="#ffb000" filter="url(#glow)">
  <rect class="b" x="461" y="168" width="28" height="8" rx="2"/>
  <rect class="b" style="animation-delay:-.4s" x="495" y="168" width="28" height="8" rx="2"/>
  <rect class="b" style="animation-delay:-.8s" x="529" y="168" width="28" height="8" rx="2"/>
  <rect class="b" style="animation-delay:-1.2s" x="563" y="168" width="28" height="8" rx="2"/>
</g>
<rect x="597" y="168" width="28" height="8" rx="2" fill="#1a2240"/>

<!-- Francês -->
<rect x="670" y="88" width="290" height="112" rx="10" fill="#0a1020" stroke="#ff2a6d" stroke-opacity=".55" stroke-width="1.5"/>
<g transform="translate(690 108)">
  <g clip-path="url(#fc)">
    <rect width="22" height="44" fill="#0055A4"/>
    <rect x="21" width="22" height="44" fill="#fff"/>
    <rect x="42" width="22" height="44" fill="#EF4135"/>
    <rect class="sh" style="animation-delay:-2.4s" x="0" y="0" width="30" height="44" fill="url(#shine)"/>
  </g>
  <rect width="64" height="44" rx="5" fill="none" stroke="#fff" stroke-opacity=".25"/>
</g>
<text class="mono" x="776" y="130" font-size="19" fill="#fff4e0">FRANCÊS</text>
<text class="mono" x="776" y="152" font-size="13" fill="#ff2a6d">BÁSICO</text>
<g fill="#ff2a6d" filter="url(#glow)">
  <rect class="b" x="776" y="168" width="28" height="8" rx="2"/>
  <rect class="b" style="animation-delay:-.6s" x="810" y="168" width="28" height="8" rx="2"/>
</g>
<g fill="#1a2240">
  <rect x="844" y="168" width="28" height="8" rx="2"/>
  <rect x="878" y="168" width="28" height="8" rx="2"/>
  <rect x="912" y="168" width="28" height="8" rx="2"/>
</g>

<rect x="3" y="3" width="994" height="218" rx="14" fill="none" stroke="url(#border)" stroke-width="2"/>
</svg>
